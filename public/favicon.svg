<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2317"/>
      <stop offset="100%" stop-color="#163e2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Stylized "P" Emblem for Prarambh -->
  <g filter="url(#glow)">
    <!-- Vertical Stem -->
    <rect x="16" y="14" width="7" height="36" rx="3.5" fill="#ffffff"/>
    
    <!-- P Curve -->
    <path d="M21 14h14a11 11 0 0 1 0 22h-14" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Genesis Spark Dot (Center of P loop) -->
    <circle cx="35" cy="25" r="4" fill="url(#accent)"/>
  </g>
</svg>
