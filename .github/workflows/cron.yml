# .github/workflows/cron.yml
name: Prarambh Cron Jobs

on:
  schedule:
    # Hourly finalization (replaces Vercel cron/finalize)
    - cron: '0 * * * *'
    # Daily cleanup at 03:30 UTC (replaces Vercel cron/cleanup)
    - cron: '30 3 * * *'

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (optional, not needed for curl)
        uses: actions/checkout@v4

      - name: Set environment variables
        env:
          BASE_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "CRON_SECRET=$CRON_SECRET" >> $GITHUB_ENV

      - name: Call /api/cron/finalize
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
        run: |
          curl -s -f -X GET "$BASE_URL/api/cron/finalize?secret=$CRON_SECRET" || echo "Finalize failed"

      - name: Call /api/cron/cleanup
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
        run: |
          curl -s -f -X GET "$BASE_URL/api/cron/cleanup?secret=$CRON_SECRET" || echo "Cleanup failed"
